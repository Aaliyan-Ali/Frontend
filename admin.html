<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | TREND HIVE</title>
    <meta name="description" content="TREND HIVE Admin Panel - Manage products and orders.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f0f0f0; }
        .admin-card { background: white; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .toast-admin {
            position: fixed;
            top: 80px;
            right: 20px;
            background: #1a1a1a;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            z-index: 9999;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }
        .toast-admin.success { border-left: 4px solid #22c55e; }
        .toast-admin.error { border-left: 4px solid #ef4444; }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between">
            <span class="text-2xl font-bold">🐝 TREND HIVE ADMIN</span>
            <div class="space-x-4">
                <a href="/" class="hover:text-gray-600">Home</a>
                <a href="/products.html">Products</a>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">

        <!-- Add Product Form -->
        <div class="admin-card p-6">
            <h2 class="text-2xl font-bold mb-4">➕ Add New Product</h2>
            <p class="text-gray-500 text-sm mb-4">Product add karne ke baad wo Products page par turant nazar aayega ✅</p>
            <form id="addProductForm" class="grid md:grid-cols-2 gap-4">
                <input type="text" id="name" placeholder="Product Name *" required class="border p-3 rounded-xl focus:ring-2 focus:ring-black focus:outline-none">
                <input type="number" id="price" placeholder="Price (USD) *" required step="0.01" min="0" class="border p-3 rounded-xl focus:ring-2 focus:ring-black focus:outline-none">
                <input type="text" id="category" placeholder="Category (e.g. Clothing, Electronics)" class="border p-3 rounded-xl focus:ring-2 focus:ring-black focus:outline-none">
                <input type="url" id="image" placeholder="Image URL (optional)" class="border p-3 rounded-xl focus:ring-2 focus:ring-black focus:outline-none">
                <textarea id="description" placeholder="Product Description" class="border p-3 rounded-xl col-span-2 focus:ring-2 focus:ring-black focus:outline-none" rows="3"></textarea>
                <input type="number" step="0.1" min="0" max="5" id="rating" placeholder="Rating (0-5)" class="border p-3 rounded-xl focus:ring-2 focus:ring-black focus:outline-none">
                <button type="submit" class="bg-black text-white py-3 rounded-xl font-bold hover:bg-gray-800 transition col-span-2">
                    ➕ Create Product
                </button>
            </form>
        </div>

        <!-- Manage Products List -->
        <div class="admin-card p-6">
            <h2 class="text-2xl font-bold mb-4">📦 Manage Products (CRUD)</h2>
            <div id="adminProductList" class="space-y-3 max-h-96 overflow-y-auto"></div>
        </div>

        <!-- Delivery Management -->
        <div class="admin-card p-6">
            <h2 class="text-2xl font-bold mb-4">🚚 Delivery Management</h2>
            <div id="ordersList" class="space-y-4"></div>
        </div>
    </div>

    <footer class="text-center py-4 text-gray-500">Admin Panel – Full control</footer>

    <script src="config.js"></script>
    <script>
        // ─── Toast ─────────────────────────────────────────────
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast-admin ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // ─── Products ──────────────────────────────────────────
        async function fetchProducts() {
            try {
                const res = await fetch(`${API_BASE}/api/products`);
                const products = await res.json();
                const container = document.getElementById('adminProductList');
                if (products.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-center py-4">Koi product nahi mila</p>';
                    return;
                }
                container.innerHTML = products.map(p => `
                    <div class="border p-3 rounded-xl flex justify-between items-center hover:bg-gray-50 transition">
                        <div class="flex items-center gap-3">
                            <img src="${p.image}" class="w-12 h-12 object-cover rounded-lg" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100'" alt="${p.name}">
                            <div>
                                <strong class="block">${p.name}</strong>
                                <span class="text-sm text-gray-500">$${p.price} | ⭐${p.rating} | ${p.category}</span>
                            </div>
                        </div>
                        <div class="space-x-2">
                            <button onclick="editProduct(${p.id})" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-sm hover:bg-blue-700">Edit</button>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-600 text-white px-3 py-1 rounded-lg text-sm hover:bg-red-700">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                showToast('❌ Products load nahi hue', 'error');
            }
        }

        // Add Product
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newProduct = {
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                category: document.getElementById('category').value || 'General',
                image: document.getElementById('image').value || '',
                description: document.getElementById('description').value,
                rating: parseFloat(document.getElementById('rating').value) || 4.0
            };
            try {
                const res = await fetch(`${API_BASE}/api/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProduct)
                });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    fetchProducts();
                    e.target.reset();
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
            } catch (err) {
                showToast('❌ Product add nahi hua', 'error');
            }
        });

        // Edit Product
        window.editProduct = async (id) => {
            const newName = prompt("Naya naam dalein:");
            const newPrice = prompt("Naya price (USD) dalein:");
            if (newName && newPrice) {
                try {
                    const res = await fetch(`${API_BASE}/api/products/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName, price: parseFloat(newPrice) })
                    });
                    const data = await res.json();
                    if (data.success) {
                        showToast(data.message, 'success');
                        fetchProducts();
                    }
                } catch (err) {
                    showToast('❌ Update nahi hua', 'error');
                }
            }
        };

        // Delete Product
        window.deleteProduct = async (id) => {
            if (confirm("Kya aap yeh product delete karna chahte hain?")) {
                try {
                    const res = await fetch(`${API_BASE}/api/products/${id}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        showToast(data.message, 'success');
                        fetchProducts();
                    }
                } catch (err) {
                    showToast('❌ Delete nahi hua', 'error');
                }
            }
        };

        // ─── Orders ────────────────────────────────────────────
        async function fetchOrders() {
            try {
                const res = await fetch(`${API_BASE}/api/orders`);
                const orders = await res.json();
                const container = document.getElementById('ordersList');
                if (orders.length === 0) {
                    container.innerHTML = '<p class="text-gray-400 text-center py-4">Koi order nahi aaya abhi tak</p>';
                    return;
                }
                container.innerHTML = orders.map(order => `
                    <div class="border p-4 rounded-xl bg-white shadow-sm hover:shadow-md transition">
                        <div class="flex justify-between items-start">
                            <div>
                                <p><strong>${order.productName}</strong></p>
                                <p class="text-sm">Customer: ${order.customerName} (${order.userEmail})</p>
                                <p class="text-sm italic">"${order.comment || 'No comment'}"</p>
                                <p class="text-xs text-gray-500">Ordered: ${new Date(order.createdAt).toLocaleString()}</p>
                            </div>
                            <div class="flex flex-col items-end gap-2">
                                <select id="status-${order.id}" class="border p-1 rounded-lg text-sm" onchange="updateStatus(${order.id}, this.value)">
                                    <option ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                    <option ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                </select>
                                <span class="text-xs text-gray-500">Status: <strong>${order.status}</strong></span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                showToast('❌ Orders load nahi hue', 'error');
            }
        }

        window.updateStatus = async (orderId, newStatus) => {
            try {
                const res = await fetch(`${API_BASE}/api/orders/${orderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    fetchOrders();
                }
            } catch (err) {
                showToast('❌ Status update nahi hua', 'error');
            }
        };

        fetchProducts();
        fetchOrders();
    </script>
</body>
</html>
